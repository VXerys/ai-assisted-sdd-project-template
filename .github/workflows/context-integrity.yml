name: Context Integrity

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "sdd.config.json"
      - "package.json"
      - "package-lock.json"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/context-integrity.yml"
  push:
    branches:
      - Queen
      - main
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "sdd.config.json"
      - "package.json"
      - "package-lock.json"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/context-integrity.yml"

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate context artifacts
        run: npm run context:validate
