name: Context Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate the template repository (strict)
        run: npm run context:validate -- --strict

      - name: Validate the example project
        run: node ../../scripts/context/validate-context.mjs
        working-directory: examples/todo-api

  template-init:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Copy the template
        run: rsync -a --exclude .git ./ ../template-init/

      - name: Initialize a lite node-api project
        run: node scripts/init/init.mjs --yes --name CI --tier lite --app node-api --db postgres --tools claude --owner ci
        working-directory: ../template-init

      - name: Validate the initialized project
        run: node scripts/context/validate-context.mjs
        working-directory: ../template-init
