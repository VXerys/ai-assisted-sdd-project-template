name: Context Integrity

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate-context:
    # The owner develops on Windows; path and line-ending bugs only show up there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end init tests
        run: npm run test:e2e

      - name: Guard check
        run: npm run sdd -- guard --check --base "${{ github.base_ref || github.event.repository.default_branch }}"

      - name: Validate the template repository (strict)
        run: npm run context:validate -- --strict

      - name: Validate the example project
        run: node ../../scripts/context/validate-context.mjs
        working-directory: examples/todo-api

  template-init:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, tier: lite, app: node-api, db: postgres }
          - { os: ubuntu-latest, tier: lite, app: flutter, db: supabase }
          - { os: ubuntu-latest, tier: full, app: nextjs, db: firebase }
          - { os: ubuntu-latest, tier: lite, app: python-api, db: none }
          - { os: windows-latest, tier: lite, app: flutter, db: supabase }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Copy the template
        run: node scripts/ci/copy-template.mjs ../template-init

      - name: Initialize a ${{ matrix.tier }} ${{ matrix.app }} + ${{ matrix.db }} project
        run: node scripts/init/init.mjs --yes --name CI --tier ${{ matrix.tier }} --app ${{ matrix.app }} --db ${{ matrix.db }} --tools claude --owner ci
        working-directory: ../template-init

      - name: Validate the initialized project (strict)
        run: node scripts/context/validate-context.mjs --strict
        working-directory: ../template-init

      - name: Run the initialized project's SDD tests
        run: npm test
        working-directory: ../template-init

      - name: The initialized project's CLI answers
        run: |
          npm run sdd -- brief
          npm run sdd -- status
        working-directory: ../template-init
